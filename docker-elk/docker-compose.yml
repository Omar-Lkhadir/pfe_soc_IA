services:

  # The 'setup' service runs a one-off script which initializes users inside
  # Elasticsearch — such as 'logstash_internal' and 'kibana_system' — with the
  # values of the passwords defined in the '.env' file. It also creates the
  # roles required by some of these users.
  #
  # This task only needs to be performed once, during the *initial* startup of
  # the stack. Any subsequent run will reset the passwords of existing users to
  # the values defined inside the '.env' file, and the built-in roles to their
  # default permissions.
  #
  # By default, it is excluded from the services started by 'docker compose up'
  # due to the non-default profile it belongs to. To run it, either provide the
  # '--profile=setup' CLI flag to Compose commands, or "up" the service by name
  # such as 'docker compose up setup'.
  setup:
    profiles:
      - setup
    build:
      context: setup/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    init: true
    volumes:
      - ./setup/entrypoint.sh:/entrypoint.sh:ro,Z
      - ./setup/lib.sh:/lib.sh:ro,Z
      - ./setup/roles:/roles:ro,Z
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
      METRICBEAT_INTERNAL_PASSWORD: ${METRICBEAT_INTERNAL_PASSWORD:-}
      FILEBEAT_INTERNAL_PASSWORD: ${FILEBEAT_INTERNAL_PASSWORD:-}
      HEARTBEAT_INTERNAL_PASSWORD: ${HEARTBEAT_INTERNAL_PASSWORD:-}
      MONITORING_INTERNAL_PASSWORD: ${MONITORING_INTERNAL_PASSWORD:-}
      BEATS_SYSTEM_PASSWORD: ${BEATS_SYSTEM_PASSWORD:-}
    network_mode: service:elasticsearch
    depends_on:
      - elasticsearch

  # The 'kibana-genkeys' service runs a one-off command which generates and
  # prints encryption keys for Kibana.
  #
  # By default, it is excluded from the services started by 'docker compose up'
  # due to the non-default profile it belongs to. To run it, either provide the
  # '--profile=setup' CLI flag to Compose commands, or "up" the service by name
  # such as 'docker compose up kibana-genkeys'.
  kibana-genkeys:
    profiles:
      - setup
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    command:
      - bin/kibana-encryption-keys
      - generate
    network_mode: none
 
#######################################################################





  elasticsearch:
    build:
      context: elasticsearch/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
      - elasticsearch:/usr/share/elasticsearch/data:Z
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      xpack.security.enabled: "true"
      node.name: "elasticsearch"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      discovery.type: "single-node"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
    networks:
      - elk
    restart: unless-stopped
#######################################################################










  logstash:
    build:
      context: logstash/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro,Z
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro,Z
    ports:
      - 5044:5044
      - 5045:5045
      # 50000/50001 : port d'injection manuelle de test (voir nids.conf) --
      # jamais destine a recevoir du trafic autre que local. Publie sur
      # 0.0.0.0 il se fait scanner/spammer par des bots internet (paquets
      # SIP/TLS aleatoires), ce qui polluait l'index nids-ml-* avec des
      # ml_status:"format_non_reconnu". Restreint a la loopback de l'hote.
      - 127.0.0.1:50000:50000/tcp
      - 127.0.0.1:50000:50000/udp
      - 127.0.0.1:50001:50001/tcp
      - 9600:9600
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      LOGSTASH_INTERNAL_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: "2"
    networks:
      - elk
    depends_on:
      - elasticsearch
      - ml-service
    restart: unless-stopped

  ml-service:
    build:
      context: ml-service/
    ports:
      - 8000:8000
    environment:
      ES_HOST: "http://elasticsearch:9200"
      ES_USER: logstash_internal
      ES_PASSWORD: ${LOGSTASH_INTERNAL_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: "2"
    networks:
      - elk
    depends_on:
      - elasticsearch
    restart: unless-stopped

  zeek-replay:
    build:
      context: zeek-replay/
    volumes:
      - /home/ubuntu/Desktop/pfe/data/zeek:/data:ro
      - zeek-live-logs:/var/log/zeek-live
    restart: unless-stopped

  # Capture Zeek REELLE sur l'interface reseau de VM1, pour le scenario
  # VM2 (attaquant, nmap -sS / hping3 --flood) -> VM1 (victime, cette
  # machine). Ecrit dans le MEME volume/chemin (/var/log/zeek-live/conn.log)
  # que zeek-replay -- filebeat-nids et logstash/pipeline/nids.conf n'ont
  # besoin d'aucune modification, le format TSV natif conn.log est identique
  # (seuls les 2 derniers champs de verite terrain du jeu de donnees labellise
  # -- label/detailed-label -- sont absents en trafic reel ; nids.conf les
  # traite deja comme optionnels, cf. tag_on_failure sur le grok "rest").
  #
  # Profil "live" (pas demarre par defaut) : ne PAS lancer en meme temps que
  # zeek-replay (les deux ecriraient dans le meme conn.log). Pour la demo
  # reelle : `docker compose --profile live up -d zeek-live` apres avoir
  # arrete zeek-replay (`docker compose stop zeek-replay`).
  #
  # network_mode: host + NET_ADMIN/NET_RAW requis pour capturer le trafic
  # reel sur l'interface physique (impossible depuis le reseau bridge Docker
  # "elk"). ZEEK_IFACE doit correspondre a l'interface reseau reelle de VM1
  # face a VM2 (ex. ens33) -- a definir dans .env si different du defaut.
  zeek-live:
    profiles:
      - live
    image: zeek/zeek:${ZEEK_VERSION:-latest}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - zeek-live-logs:/var/log/zeek-live
      - ./zeek-live/policy/no_rotation.zeek:/usr/local/zeek/share/zeek/site/no_rotation.zeek:ro
    working_dir: /var/log/zeek-live
    command: ["zeek", "-C", "-i", "${ZEEK_IFACE:-ens33}", "local", "no_rotation"]
    restart: unless-stopped

  filebeat-nids:
    build:
      context: filebeat-nids/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    user: root
    volumes:
      - zeek-live-logs:/var/log/zeek-live:ro
      # Persiste le registre (offsets de lecture) -- sans ca, recreer le
      # conteneur perd l'etat et, combine a tail_files, saute un morceau
      # d'evenements au lieu de simplement reprendre where on s'est arrete.
      - filebeat-nids-data:/usr/share/filebeat/data
    networks:
      - elk
    depends_on:
      - logstash
      - zeek-replay
    restart: unless-stopped

  kibana:
    build:
      context: kibana/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z
    environment:
      XPACK_ACTIONS_ENCRYPTIONKEY: "wxcvbn1234567890wxcvbnmlkjh12345"
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:-}
    ports:
      - 5601:5601
    networks:
      - elk
    depends_on:
      - elasticsearch
    restart: unless-stopped







networks:
  elk:
    driver: bridge

volumes:
  elasticsearch:
  zeek-live-logs:
  filebeat-nids-data:
