input {
	beats {
		port => 5044
	}

	tcp {
		port => 50000
	}
}

######################### Add your filters / logstash plugins configuration here

filter {
  # ── Auth / SSH ───────────────────────────
  if [log_category] == "authentication" or [log_type] == "ssh_auth" or "auth" in [tags] or "ssh" in [tags] {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host_name} sshd\[%{NUMBER:pid}\]: Failed %{WORD:method} for %{USER:username} from %{IP:src_ip} port %{NUMBER:src_port}",
          "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host_name} sshd\[%{NUMBER:pid}\]: Invalid user %{USER:username} from %{IP:src_ip} port %{NUMBER:src_port}",
          "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host_name} sshd\[%{NUMBER:pid}\]: Accepted %{WORD:method} for %{USER:username} from %{IP:src_ip} port %{NUMBER:src_port}",
          "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host_name} sudo:\s+%{USER:username} : TTY=%{DATA:tty} ; PWD=%{DATA:pwd} ; USER=%{DATA:sudo_user} ; COMMAND=%{GREEDYDATA:sudo_command}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_auth"]
    }

    if "Failed" in [message] or "Invalid user" in [message] {
      mutate { add_field => { "event_type" => "ssh_failed" "severity" => "HIGH" "attack_suspected" => "true" } }
    } else if "Accepted" in [message] {
      mutate { add_field => { "event_type" => "ssh_success" "severity" => "INFO" } }
    } else if "sudo" in [message] {
      mutate { add_field => { "event_type" => "sudo_usage" "severity" => "MEDIUM" } }
    }

    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
      mutate {
        convert => { "src_port" => "integer" }
      }
    }
  }

  # ── Syslog / Kernel ─────────────────────
  if [log_category] == "system" or [log_category] == "kernel" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:ts} %{HOSTNAME:host_name} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure_syslog"]
    }
    mutate { add_field => { "event_type" => "system_log" } }
  }

  # ── Commandes bash ─────────────────────
  if [log_category] == "bash_commands" {
    mutate {
      add_field => {
        "event_type" => "bash_command"
        "severity"   => "MEDIUM"
      }
    }
  }

  # ── Packages installés ──────────────────
  if [log_category] == "packages" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:ts} %{WORD:action} %{DATA:package_name} %{DATA:package_version}"
      }
      tag_on_failure => ["_grokparsefailure_pkg"]
    }
    mutate { add_field => { "event_type" => "package_activity" } }
  }

  # ── Ajouter IP du client ────────────────
  mutate {
    add_field => { "client_ip" => "192.168.1.43" }
  }

  # ── Timestamp ──────────────────────────
  date {
    match => ["ts", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
    target => "@timestamp"
  }
}

# ════════════════════════════════════════════
output {
  # Logs auth → index dédié
  if [log_category] == "authentication" {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      index    => "client-auth-%{+YYYY.MM.dd}"
      user     => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
    }
  }

  # Métriques système
  else if [@metadata][beat] == "metricbeat" {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      index    => "client-metrics-%{+YYYY.MM.dd}"
      user     => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
    }
  }

  # Trafic réseau / navigation
  else if [@metadata][beat] == "packetbeat" {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      index    => "client-network-%{+YYYY.MM.dd}"
      user     => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
    }
  }

  # Audit syscalls
  else if [@metadata][beat] == "auditbeat" {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      index    => "client-audit-%{+YYYY.MM.dd}"
      user     => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
    }
  }

  # Tout le reste (syslog, bash, packages, filebeat...)
  else {
    elasticsearch {
      hosts    => ["elasticsearch:9200"]
      index    => "client-logs-%{+YYYY.MM.dd}"
      user     => "logstash_internal"
      password => "${LOGSTASH_INTERNAL_PASSWORD}"
    }
  }
}
