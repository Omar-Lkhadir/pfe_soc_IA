# Pipeline NIDS — SOC Intelligent (PFE IT6)
#
# Événements de flux réseau (NetFlow/CICFlowMeter/Zeek) -> service ML
# (ml-service, FastAPI) -> Elasticsearch.
#
# Deux entrées :
#   - beats (port 5045) : flux TEMPS RÉEL réel, via Filebeat (module zeek).
#     Filebeat définit nativement event.module="zeek" -> détection de source
#     automatique, aucune config supplémentaire nécessaire ici.
#   - tcp + json_lines (port 50001) : conservé pour l'injection manuelle
#     d'événements de test (voir ml-service/test-events/), format simulant
#     ce que Filebeat enverrait (champ "event.module" explicite).
# Basé sur elk/logstash-nids.conf du dépôt modele_IA, adapté aux noms de
# service du réseau Docker "elk" (ml-service, elasticsearch) à la place de
# localhost.

input {
  beats {
    port => 5045
  }

  tcp {
    port  => 50001
    codec => json_lines
  }
}

filter {
  # --- Decodage des logs Zeek natifs recus via Filebeat (filestream brut,
  # pas le module Filebeat officiel -- evite la dependance a des pipelines
  # d'ingestion Elasticsearch non enregistres quand la sortie est Logstash,
  # jamais confirme dans ce depot, cf. elk/README.md du modele) ---
  if [fields][log_type] == "zeek_raw" {
    # Lignes d'en-tete Zeek (#separator, #fields, #types...) -> ignorees
    if [message] =~ /^#/ or [message] == "" {
      drop {}
    }

    # Format natif Zeek conn.log (TSV) : ts, uid, id.orig_h, id.orig_p,
    # id.resp_h, id.resp_p, proto, service, duration, orig_bytes, resp_bytes,
    # conn_state, local_orig, local_resp, missed_bytes, history, orig_pkts,
    # orig_ip_bytes, resp_pkts, resp_ip_bytes, puis un dernier bloc
    # "tunnel_parents label detailed-label" separe par des ESPACES (pas des
    # tabulations) -- particularite documentee dans zeek_adapter.py.
    dissect {
      mapping => {
        "message" => "%{[@metadata][ts]}	%{[@metadata][uid]}	%{orig_h_raw}	%{[@metadata][orig_p]}	%{resp_h_raw}	%{resp_p_raw}	%{proto}	%{[@metadata][service]}	%{duration}	%{[@metadata][orig_bytes]}	%{[@metadata][resp_bytes]}	%{[@metadata][conn_state]}	%{[@metadata][local_orig]}	%{[@metadata][local_resp]}	%{[@metadata][missed_bytes]}	%{history}	%{orig_pkts}	%{orig_ip_bytes}	%{resp_pkts}	%{resp_ip_bytes}	%{[@metadata][rest]}"
      }
      tag_on_failure => ["_dissectfailure_zeek"]
    }

    if "_dissectfailure_zeek" in [tags] {
      drop {}
    }

    # rest = "tunnel_parents label detailed-label" (espaces)
    grok {
      match => { "[@metadata][rest]" => "%{NOTSPACE:[@metadata][tunnel_parents]}\s+%{NOTSPACE:zeek_label}\s+%{NOTSPACE:zeek_detailed_label}" }
      tag_on_failure => ["_grokparsefailure_zeek_rest"]
    }

    mutate {
      rename => {
        "resp_p_raw"  => "[id.resp_p]"
        "orig_h_raw"  => "[id.orig_h]"
        "resp_h_raw"  => "[id.resp_h]"
      }
      add_field => {
        "[event][module]" => "zeek"
        "data_origin"      => "live"
        "Label_binaire"    => "0"
        "Attack_brut"      => "Benign"
      }
    }

    # --- IPv4 uniquement : le dashboard n'affiche que des adresses IPv4.
    # Le trafic IPv6 observe ici est essentiellement du bruit local sans
    # signification pour la detection (link-local fe80::/10 non routable,
    # multicast ff00::/8, decouverte de voisins...) que le modele (entraine
    # sur un dataset IPv4) confond frequemment avec un scan (beaucoup
    # d'hotes distincts, meme port, jamais de reponse). On l'ecarte avant
    # meme l'appel au modele ML, plutot que de le laisser polluer le
    # dashboard avec des adresses source/destination IPv6. ---
    if [id.orig_h] =~ /:/ or [id.resp_h] =~ /:/ {
      drop {}
    }

    # --- IP attaquant vs IP victime : id.orig_h n'est PAS toujours
    # l'attaquant, c'est juste l'initiateur du flux -- quand VM1 (la
    # machine surveillee, victime) genere elle-meme du trafic sortant
    # (DNS, appel a un serveur externe...) jugé suspect par le modele,
    # id.orig_h = VM1 et le vrai suspect est en face (id.resp_h). On
    # determine donc le cote "attaquant" = celui qui n'est PAS VM1,
    # dans les deux sens (scan entrant VM2->VM1 comme trafic sortant
    # suspect VM1->exterieur).
    ruby {
      code => '
        victime_ips = ["192.168.1.48"]
        orig = event.get("[id.orig_h]")
        resp = event.get("[id.resp_h]")
        if victime_ips.include?(orig)
          event.set("ip_source", resp)
          event.set("ip_destination", orig)
        else
          event.set("ip_source", orig)
          event.set("ip_destination", resp)
        end
      '
    }

    # --- IP attaquant -> nom d'hote lisible pour le SOC, via table statique
    # (dictionnaire de la maquette/labo, pas de DNS inverse fiable sur un LAN
    # isole sans zone reverse configuree) ---
    translate {
      source      => "[ip_source]"
      target      => "attacker_hostname"
      dictionary_path => "/usr/share/logstash/pipeline/attacker_hosts.yml"
      fallback    => "%{[ip_source]}"
      refresh_interval => 30
    }
    if [zeek_label] == "Malicious" {
      mutate {
        replace => { "Label_binaire" => "1" }
        replace => { "Attack_brut" => "%{zeek_detailed_label}" }
      }
    }
    mutate {
      convert => { "Label_binaire" => "integer" }
      remove_field => ["zeek_label", "zeek_detailed_label", "message", "tags"]
    }
  }

  # --- Appel au service ML (ml-service, commun/service.py) ---
  ruby {
    code => 'event.set("[@metadata][ml_event_json]", event.to_hash.to_json)'
  }

  http {
    url             => "http://ml-service:8000/predict"
    verb            => "POST"
    headers         => { "Content-Type" => "application/json" }
    body            => '{"event": %{[@metadata][ml_event_json]}, "source": "%{[event][module]}"}'
    body_format     => "text"
    target_body     => "[ml]"
    connect_timeout => 10
    socket_timeout  => 30
    request_timeout => 30
  }

  # --- Aplatit ml.* à la racine pour Kibana ---
  if [ml] {
    mutate {
      rename => {
        "[ml][ml_status]"       => "ml_status"
        "[ml][is_attack]"       => "is_attack"
        "[ml][anomaly_score]"   => "anomaly_score"
        "[ml][attack_category]" => "attack_category"
        "[ml][confidence]"      => "confidence"
      }
      remove_field => ["ml"]
    }
  } else {
    # Service ML injoignable/en erreur -> l'event brut est quand même
    # indexé, juste marqué comme tel (jamais de perte silencieuse).
    mutate {
      add_field => { "ml_status" => "service_indisponible" }
    }
  }
}

output {
  elasticsearch {
    hosts    => ["elasticsearch:9200"]
    index    => "nids-ml-%{+YYYY.MM.dd}"
    user     => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
  }
}
