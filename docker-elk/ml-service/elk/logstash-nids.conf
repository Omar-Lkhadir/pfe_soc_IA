# Pipeline Logstash — SOC Intelligent (PFE IT6)
#
# Filebeat (modules netflow / zeek / ...) -> Logstash -> service ML
# (commun/service.py, FastAPI) -> Elasticsearch.
#
# NON TESTÉ CONTRE UN VRAI LOGSTASH (aucune instance disponible dans cet
# environnement) -- la syntaxe ci-dessous est vérifiée contre la doc
# officielle du plugin logstash-filter-http (elastic.co/guide/en/logstash/
# current/plugins-filters-http.html), mais jamais exécutée. À valider en
# environnement réel avant mise en prod, en particulier :
#   - le comportement exact du filtre http quand le service ML est injoignable
#     (timeout/connexion refusée) n'est pas clairement documenté -- vérifier
#     que l'event continue bien vers la sortie Elasticsearch plutôt que d'être
#     perdu (cf. principe déjà appliqué côté Python : jamais de perte
#     silencieuse d'événement, commun/inference.py).
#   - le nom exact du champ source.module peut varier légèrement selon la
#     version de Filebeat -- vérifier avec un vrai event capturé.

input {
  beats {
    port => 5044
  }
}

filter {
  # --- Appel au service ML (commun/service.py) ---
  # Le filtre http ne sait pas sérialiser "tout l'event" directement ; on
  # construit donc le JSON du corps de requête via un filtre ruby, puis on
  # l'injecte tel quel (body_format => "text", PAS "json" -- le JSON est
  # déjà construit ci-dessous, pas besoin d'une seconde sérialisation).
  ruby {
    code => 'event.set("[@metadata][ml_event_json]", event.to_hash.to_json)'
  }

  http {
    url            => "http://localhost:8000/predict"
    verb           => "POST"
    headers        => { "Content-Type" => "application/json" }
    body           => '{"event": %{[@metadata][ml_event_json]}, "source": "%{[event][module]}"}'
    body_format    => "text"
    target_body    => "[ml]"
    connect_timeout => 5
    socket_timeout  => 10
    request_timeout => 15
  }

  # --- Aplatit ml.* à la racine pour Kibana (plus simple à visualiser que
  # des champs imbriqués) ---
  if [ml] {
    mutate {
      rename => {
        "[ml][ml_status]"        => "ml_status"
        "[ml][is_attack]"        => "is_attack"
        "[ml][anomaly_score]"    => "anomaly_score"
        "[ml][attack_category]"  => "attack_category"
        "[ml][confidence]"       => "confidence"
      }
      remove_field => ["ml"]
    }
  } else {
    # Service ML injoignable/en erreur -> l'event brut est quand même
    # indexé (voir note en tête de fichier), juste marqué comme tel.
    mutate {
      add_field => { "ml_status" => "service_indisponible" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "nids-ml-%{+YYYY.MM.dd}"
  }
}
